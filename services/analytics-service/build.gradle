plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

dependencies {
    implementation project(':proto')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.apache.kafka:kafka-streams'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.13'
    implementation "io.grpc:grpc-netty-shaded:${grpcVersion}"
    implementation 'net.logstash.logback:logstash-logback-encoder:8.0'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.apache.kafka:kafka-streams-test-utils'
    testImplementation "io.grpc:grpc-inprocess:${grpcVersion}"
    testImplementation 'io.zonky.test:embedded-postgres:2.1.0'
    testImplementation 'org.testcontainers:junit-jupiter:1.20.4'
    testImplementation 'org.testcontainers:kafka:1.20.4'
    testImplementation 'org.testcontainers:postgresql:1.20.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach {
    // e.g. -Pit.kafka=localhost:9092 runs the Kafka integration test against an existing broker
    if (project.hasProperty('it.kafka')) {
        systemProperty 'it.kafka', project.property('it.kafka')
    }
}

// Pipeline measurements against a running stack, see docs/load-testing.md
tasks.register('loadTest', JavaExec) {
    group = 'verification'
    description = 'Runs the load test against a running stack (pass options with -Pargs="--events 20000")'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.githubpulse.analytics.loadtest.LoadTest'
    workingDir = rootProject.projectDir
    if (project.hasProperty('args')) {
        args = project.property('args').toString().split(' ').toList()
    }
}

springBoot {
    mainClass = 'com.githubpulse.analytics.AnalyticsApplication'
}
